# Vehicle taxonomy used to pull make/model out of listing titles.
#
# How matching works (see ebayparts/enrich.py):
#   1. Every make alias is searched for in the title. The LEFTMOST match wins,
#      because eBay titles are written "<years> <make> <model> <part> ...".
#   2. Models are then only searched WITHIN the winning make's list. This is
#      what stops "CHEVY TAHOE WHEEL RIM TIRE PATHFINDER HT" from being logged
#      as a Nissan Pathfinder -- "Pathfinder" there is a tire model, and it is
#      not in Chevrolet's model list, so it is never considered.
#   3. Longest model alias wins ("3 Series" beats "3"), so order here is
#      irrelevant; specificity is computed at load time.
#
# Add makes/models freely. Aliases are matched case-insensitively on word
# boundaries, so "MB" will not match inside "COMBO".

